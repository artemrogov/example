services:
  service-oauth2-keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_IMAGE_TAG:-26.4.0}
    container_name: ${TEST_KEYCLOAK_CONTAINER_NAME:-service-oauth2-keycloak}
    restart: on-failure
    command: ["start", "--import-realm"]
    environment:
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: "/auth"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HOSTNAME_STRICT: "false"
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "xCuoP983vm12"
      KC_HTTP_PORT: "8181"
      KC_HTTP_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8181; echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: http://localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; if [ $? -eq 0 ]; then echo 'Healthcheck Successful'; exit 0; else echo 'Healthcheck Failed'; exit 1; fi"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "${TEST_KEYCLOAK_PORT_MAPPING:-8484}:8181"
    volumes:
      - ./service_oauth/keycloak/test_realm.json:/opt/keycloak/data/import/test_realm.json:ro
    networks:
      - all_local_dev_omega_bi_kafka

  service-oauth2-redis:
    image: redis:${REDIS_IMAGE_TAG:-7.2.2}
    container_name: ${SERVICE_OAUTH2_REDIS_CONTAINER_NAME:-service-oauth2-redis}
    tty: true
    restart: on-failure
    command: >
      redis-server
      --requirepass mKysp4sv5n3N
      --notify-keyspace-events Ex
    ports:
      - "${SERVICE_OAUTH2_CLIENT_REDIS_PORT_MAPPING:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "mKysp4sv5n3N", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - all_local_dev_omega_bi_kafka

  service-user-postgres:
    image: library/postgres:${POSTGRES_IMAGE_TAG:-15.3}
    container_name: ${POSTGRES_CONTAINER_NAME:-service-user-postgres}
    restart: on-failure
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "postgres"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "${POSTGRES_PORT_MAPPING:-5434}:5432"
    deploy:
      resources:
        limits:
          memory: "${POSTGRES_MEMORY_LIMIT:-256M}"
    volumes:
      - type: bind
        source: ./user_service/init/
        target: /docker-entrypoint-initdb.d/
        read_only: true
    networks:
      - all_local_dev_omega_bi_kafka

  service-auth-postgres:
    image: library/postgres:${POSTGRES_IMAGE_TAG:-15.3}
    container_name: ${SERVICE_AUTH_POSTGRES_CONTAINER_NAME:-service-auth-postgres}
    restart: on-failure
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "postgres"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "${SERVICE_AUTH_POSTGRES_PORT_MAPPING:-5435}:5432"
    deploy:
      resources:
        limits:
          memory: "${SERVICE_AUTH_POSTGRES_MEMORY_LIMIT:-256M}"
    volumes:
      - type: bind
        source: ./service_auth/init/
        target: /docker-entrypoint-initdb.d/
        read_only: true
    networks:
      - all_local_dev_omega_bi_kafka

  kafka-broker:
    image: confluentinc/cp-kafka:5.5.2
    container_name: kafka-broker
    hostname: kafka-broker
    expose:
      - "9092"
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      LANG: en_US.utf8
      LC_ALL: en_US.utf8
      JDK_JAVA_OPTIONS: -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,OUTSIDE://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-broker:9092,OUTSIDE://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_HOST_NAME: kafka-broker
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG4J_ROOT_LOGLEVEL: ERROR
      KAFKA_LOG4J_LOGGERS: org.apache.zookeeper=ERROR,org.apache.kafka=ERROR,kafka=ERROR,kafka.cluster=ERROR,kafka.controller=ERROR,kafka.coordinator=ERROR,kafka.log=ERROR,kafka.server=ERROR,kafka.zookeeper=ERROR,state.change.logger=ERROR
      KAFKA_LOG_RETENTION_MS: 86400000
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 20000
      KAFKA_LOG_SEGMENT_BYTES: 107374182
      KAFKA_LOG_SEGMENT_DELETE_DELAY_MS: 1000
    depends_on:
      - zookeeper
    networks:
      - all_local_dev_omega_bi_kafka

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    ports:
      - 9093:8080
    environment:
      DYNAMIC_CONFIG_ENABLED: true
      KAFKA_CLUSTERS_0_NAME: esb
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-broker:9092
    networks:
      - all_local_dev_omega_bi_kafka

  zookeeper:
    image: zookeeper:3.5.10
    container_name: zookeeper
    hostname: zookeeper
    expose:
      - "2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOO_MY_ID: 1
    networks:
      - all_local_dev_omega_bi_kafka

networks:
  all_local_dev_omega_bi_kafka:
    driver: bridge