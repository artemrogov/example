<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Socket Client Example</title>
    <!-- Загрузка необходимых скриптов -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stomp-websocket/lib/stomp.min.js"></script>
</head>
<body>
<h1>Socket Client Example</h1>
<div id="messages"></div>
<script type="text/javascript">
document.addEventListener("DOMContentLoaded", () => {
    // Адрес сокета
    const socketUrl = 'http://localhost:8183/result-interpreter';

    // Токен пользователя
    const jwtToken = 'Bearer eyJhbGciOiJIUzUxMiJ9.eyJpc19tYXN0ZXIiOmZhbHNlLCJ1c2VyX2lkIjoiMTQ2ODU1NmYtYTExYy00OTc0LTljNGQtMzE2MzFhNzBiMzQ5Iiwicm9sZXMiOnsiYWY4ZTQzZDQtMjI5ZC00MGI2LTk5ZjAtMGQzNDNkY2E5MzliIjpbIlJPTEVfQVBQTElDQVRJT05fREVTSUdORVIiLCJST0xFX1JFUE9SVF9ERVZFTE9QRVIiLCJST0xFX0RBVEFfRU5HSU5FRVIiXX0sInN1YiI6InJvZ2FyIiwiaWF0IjoxNzUyMDgxODkxLCJleHAiOjE3NTIwOTI2OTEsImp0aSI6ImJjYjk0OWIyLTJhNjctNDE1OS1iOTkyLTk2M2I2MDkxNTA5ZSJ9.IubLCESf6GS-7e8llVTB7xxTS-GWJfa8hHhJJjGmMcJlxmbs147_TMBFcvK1Lx28eHP1U4RMENAITpKi7mqbpg';

    /// Guid Ream
    const realmGuid = 'af8e43d4-229d-40b6-99f0-0d343dca939b';

    // Элемент страницы для вывода сообщений
    const messagesDiv = document.querySelector('#messages');

    // Подключаемся к серверу через SockJS
    let sockjs = new SockJS(socketUrl, null, {
          transportOptions: {
            headers: {
              Authorization: jwtToken
            }
          }
     });

    // Устанавливаем соединение через STOMP
    let stompClient = Stomp.over(sockjs);

    // Функция добавления сообщений на страницу
    function addMessage(text) {
        const messageElement = document.createElement('div');
        messageElement.textContent = text;
        messagesDiv.appendChild(messageElement);
    }

    // Подключаемся к серверу ws:
    stompClient.connect({Authorization: jwtToken, Realm_guid: realmGuid},  function(frame) {
        addMessage(`Подключён к серверу (${frame})`);

        // Подписываемся на канал '/user/logs_data'
        stompClient.subscribe('/user/logs_data', function(message) {
            //const data = JSON.parse(message.body);
            addMessage(message.body);
        });
    });

    // Обрабатываем ошибку подключения
    sockjs.onclose = function() {
        addMessage('Отключились от сервера.');
    };
});
</script>
</body>
</html>
